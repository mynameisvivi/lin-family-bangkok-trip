oe`,part:`下午`,category:`food`,time:`14:30–15:30`,ride:`車程 15 分鐘`,title:`Kuay Jab Mr. Joe 脆皮豬`,en:`Kuay Jab Mr. Joe`,address:`313/7 Chan Rd, Wat Phraya Krai, Bang Kho Laem, Bangkok 10120`,verified:!0,query:`Kuay Jab Mr. Joe, 313/7 Chan Rd, Bang Kho Laem, Bangkok`,cover:`my-logo.png`,memo:`連續多年得到曼谷米其林必比登街頭小吃名單。\n必吃 **脆皮豬、招牌脆皮燒腩湯**（16:30關門）`,detail:`脆皮豬前一晚先醃，整天現炸，皮脆不油。\n招牌脆皮燒腩湯，湯頭以白胡椒為底，可以加入麵或粄條，也可單吃配飯，米飯是世界認證最好吃的白米飯-泰國香米。\n脆皮燒腩 ฿80、脆皮燒腩湯 ฿80。\n營業時間：07:30–16:30。`},{id:`d1-corner`,part:`下午`,category:`spot`,time:`16:00–17:00`,ride:`車程 8 分鐘`,title:`The Corner House Bangkok`,en:`The Corner House Bangkok`,address:`Chai Pattanasin Building, Charoen Krung Soi 35, Talat Noi, Samphanthawong, Bangkok 10100`,verified:!0,query:`The Corner House Bangkok Talat Noi`,cover:`my-logo.png`,memo:`寵物友善的快閃展覽：\nCOME IN MY HOUSE, MY DOGS WON’T BITE!`,detail:`本次展覽的靈感來自於人們拜訪朋友家時，主人常說的客套話：「快進來，我家的狗不咬人！」\n由泰國知名插畫家Inkf.ff一手打造，把整座歷史建築變成了他幻想中的狗狗之家，透過成群調皮、搗蛋的狗狗藝術裝置，營造出既混亂又極度溫馨的玩樂空間。\n其作品風格以色彩繽紛、充滿童趣且線條幽默著稱。\n一樓有限定狗狗拍貼機，展覽為免費入場。`},{id:`d1-lek`,part:`下午`,category:`massage`,time:`17:30–19:00`,ride:`步行 11 分鐘（800 公尺）`,rideMode:`walking`,title:`Lek Massage Bangkok`,en:`Lek Massage Bangkok (Hualamphong)`,address:`14th Floor, The Quarter Hotel Hualamphong, 23/34-35 Tri Mit Rd, Talat Noi, Samphanthawong, Bangkok 10100`,verified:!0,query:`Lek Massage The Quarter Hualamphong Talat Noi Bangkok`,cover:`my-logo.png`,memo:`分店：-MRT Hualamphong - The Quarter Hualamphong`,detail:`距離近的連鎖按摩店｜營業時間 10:00–23:30。\n身體磨砂＋精油按摩 90 分鐘 ฿1453\n精油按摩 90 分鐘 ฿1362\n芳香足部按摩 90 分鐘 ฿727\n（不同預約平台價格略有差異）。`},{id:`d1-back`,part:`晚上`,category:`hotel`,time:`19:30`,ride:`車程 14 分鐘`,title:`回酒店Check-in休息`,en:k.en,address:k.address,query:`Mandarin Oriental Bangkok`,memo:`**每房房卡要兩張、房間安排在隔壁**`,cover:`my-logo.png`,detail:`Ask for pillow menu with personal butler upon check-in.`},{id:`d1-711`,part:`晚上`,category:`plain`,ride:`步行 4 分鐘`,rideMode:`walking`,title:`距離最近的7-11`,en:`7-Eleven near Mandarin Oriental Bangkok`,address:`1249 ถ. เจริญกรุง Suriya Wong, Bang Rak, Bangkok 10500泰國`,verified:!0,query:`7-Eleven สาขา เจริญกรุง 47/3 (06805)`,memo:`買宵夜、零食都方便`,cover:`my-logo.png`,detail:`下載 7-Eleven TH（泰國 7-11 的官方 App，需泰國電話號碼註冊）\nALL ONLINE 線上商店可以直接下單預訂、付清款項，選擇最近的門市取貨。\n最厲害的是：出發前在台灣就可以先下單了！\n還可以直接叫 7-11 外送，設定好飯店地址，熱騰騰的熱壓吐司、飲料、零食，直接外送到飯店大廳給你，完全不用自己走路🥺`},{id:`d1-choong`,part:`晚上`,category:`food`,title:`Choongman Chicken Silom（晚餐外送）`,en:`Choongman Chicken Silom`,address:`60/1 Soi Silom 2/1, Silom Rd, Suriya Wong, Bang Rak, Bangkok 10500`,verified:!0,query:`Choongman Chicken Silom, Silom Soi 2/1, Bangkok`,cover:`my-logo.png`,memo:`必吃 **Snow Onion**，太晚會賣完｜記得要餐具`,detail:`韓式炸雞連鎖店，Silom 分店。\n一定要點 Snow Onion！原味超酥脆，配上滿滿洋蔥＋特製美乃滋，層次直接拉滿！\nSIZE S：5塊，150g\nREGULAR（SIZE M）：8-9塊，270g`},{id:`d1-kaprao`,part:`晚上`,category:`food`,title:`Tiew Kaprao（晚餐外送）`,en:`Tiew Kaprao`,verified:!1,query:`Tiew Kaprao Bangkok`,cover:`my-logo.png`,memo:`打拋豬界的天花板，香氣炸裂｜記得要餐具`,detail:`除了打拋豬，還有牛、雞、蝦、魷魚，絕對是你不能錯過的正宗打拋飯店。\nGrab 或 Foodpanda 有外送，推薦再加20泰銖的雞蛋豆腐。\n吃大辣的可以點50%辣度！一般人點25%辣就很夠了。`},{id:`d1-roti`,part:`晚上`,category:`food`,title:`Roti Sai Mai（晚餐外送）`,en:`Roti Sai Mai Bang Oen Aroi`,verified:!1,query:`Roti Sai Mai Bang Oen Aroi Bangkok`,cover:`my-logo.png`,memo:`01想吃的，糖絲捲餅`,detail:`把彩色龍鬚糖絲包進捲餅皮的泰國傳統甜點。\nGrabfood, Foodpanda, Lineman搜尋Roti Sai Mai\nNotion有泰文店名`},{id:`d1-jeho`,part:`晚上`,category:`food`,title:`Jeh O Chula（晚餐外送）`,en:`Jeh O Chula`,address:`113 Soi Charat Mueang, Rong Mueang, Pathum Wan, Bangkok 10330`,verified:!0,query:`Jeh O Chula, Soi Charat Mueang, Rong Mueang, Bangkok`,cover:`my-logo.png`,memo:`必點 **Tom Yum Mama 冬蔭泡麵鍋**｜記得要餐具`,detail:`超過 60 年的老店，手工豬肉丸冬蔭泡麵鍋加兩顆生蛋黃、自己敲進湯裡拌開，多年入選米其林必比登推介。\n現場排隊常到2小時，叫外送加官方Line ID @jo113 或是haigao，直接跟店家說要點餐，店家會把30幾頁的菜單發給你。\n外送還會貼心的把湯跟麵分開，送來的時候還是熱熱的。\nLINE下達的訂單，付款方式為只接受現金。`}]},{id:`d2`,date:`2026-10-09`,dow:`五`,md:`10/9`,items:[{id:`d2-bf`,part:`早上`,category:`food`,time:`08:00–09:30`,title:`飯店自助早餐`,en:k.en,address:k.address,query:`Mandarin Oriental Bangkok`},{id:`d2-factory`,part:`早上`,category:`cafe`,time:`10:00–11:30`,ride:`車程 30 分鐘`,title:`Factory Coffee – BKK`,en:`Factory Coffee - BKK`,address:`49 Phaya Thai Rd, Ratchathewi, Bangkok 10400`,verified:!0,query:`Factory Coffee BKK, 49 Phaya Thai Rd, Bangkok`,cover:`my-logo.png`,memo:`全曼谷最好喝的冠軍咖啡沒有之一！平日9:30-10:30完全不用排隊\n必點 **MOSCOW、Phayathai、Supreme、可頌**`,detail:`泰國精品咖啡品牌，水泥牆工業風空間。\n採一次點餐制，加點需重新排隊，排隊時還可以聞香一旁的陳列咖啡豆。\nSupreme ฿180：有桌邊服務，店內人氣第一的特調！帶有濃郁的肉桂香氣，看著咖啡師將綿密的奶泡倒進高腳杯中，儀式感十足。入口首先是極綿密的奶泡，立即感受到濃郁奶香，後味是香濃的肉桂味，口味上跟MOSCOW相較之下偏甜，喜歡肉桂的朋友一定要試試！\nPhaya Thai ฿160：以店鋪所在地命名，是最具代表性的特調之一。咖啡師會進行桌邊服務，將咖啡與柑橘皮油、通寧水等巧妙融合，口感層次豐富，帶有清新的柑橘酸甜香氣，酸甜檸檬香搭上espresso，口味上非常清爽，完全不苦澀的夏日首選！讓常見的西西里咖啡給人深刻的印象，即使是不常喝咖啡的人也能輕鬆享受。\nMoscow ฿160：招牌咖啡之一，綿密奶霜帶可可味的Dirty咖啡。使用吸睛的骷髏頭造型杯盛裝，上層是綿密厚實的奶蓋，搭配底部的巧克力醬和濃縮咖啡，苦甜平衡，口感滑順濃郁。是喝過最好喝的拿鐵加入鮮奶油的奶泡，更香更綿密，苦甜巧克力味配上espresso層次感很棒，是我今天心中第一名。\nMrs. Cold ฿120：口感溫順偏奶味的特調，由雙層濃縮咖啡與冰涼的特製牛奶結合，奶香濃郁。\n鹹蛋黃可頌 ฿140：流沙奶酥內餡\n泰奶可頌 ฿140：酥脆好吃，爆漿的泰奶`},{id:`d2-massage`,part:`下午`,category:`massage`,time:`13:00–15:00`,ride:`車程 30 分鐘`,title:`Bangkok Sports Massage – Silom`,en:`Bangkok Sports Massage Silom`,verified:!1,query:`Bangkok Sports Massage - Silom`,cover:`my-logo.png`,memo:`不收小費，按摩的價格就是標準價\n推薦運動按摩、辦公室綜合症按摩`,detail:`運動按摩力道通常比一般泰式按摩更深，技師會用深層力道、精準的激痛點處理、輔助伸展，針對特定緊繃肌群放鬆，通常是下背、臀部、腿後側、肩膀或頸部。如果你有明確的疼痛或活動受限，例如辦公室症候群、健身後痠痛、高爾夫肩、跑步緊繃就選運動按摩。特別適合久坐上班族、運動後肌肉緊綳、肩頸僵硬或關節活動度受限者。建議90分鐘（60分鐘太短，做不到真正的深層放鬆）。\n運動按摩，真的比較會按，真是專業的按摩師！我從沒想過按摩能如此令人神清氣爽。他們能看出你在運動中哪些地方做得不對，以及我們可以如何改進。對於像我這樣熱愛運動的人來說，這真的很有幫助。\n這家店不像有些按摩店那樣需要你尷尬地給小費，按摩的價格就是標準價。我做的是辦公室綜合症按摩，因為我的肩膀很僵硬，他們非常用力地幫我放鬆。我以前以為運動按摩只適合經常運動的人，但他們推薦我66歲的媽媽做輕柔的運動按摩。按摩後感覺非常舒爽，她說她還想再去一次。我強烈推薦你一定要試試。\n運動按摩90分鐘 ฿1350\n辦公室症候群療法90分鐘 ฿1350`},{id:`d2-bubble`,part:`下午`,category:`cafe`,time:`16:30–18:30`,ride:`車程 1 小時 30 分鐘`,title:`Bubble in the Forest Cafe`,en:`Bubble in the Forest Cafe`,address:`170 Charoen Tha Alley, Bang Toei, Sam Phran, Nakhon Pathom 73170`,verified:!0,query:`Bubble in the Forest Cafe, Sam Phran, Nakhon Pathom`,cover:`my-logo.png`,memo:`泰國小馬爾地夫，穿淺色系或度假風服裝，整體更搭\n戶外環境吸引蚊蟲，建議攜帶**防蚊液**`,detail:`建議選船型涼亭，有懶人沙發，還有一個小盪鞦韆。\n有低消，禁 泰國品牌專櫃、全球各地爆紅咖啡廳、美食餐廳、3C用品、泰國居家雜貨、超市掃伴手禮都一次滿足，相當的豐富及多元，可以說是近年來最強、最有設計規畫性的商場，很值得排一天的時間來細逛喔！`},{id:`d3-pupon`,part:`晚上`,category:`food`,time:`18:00–19:30`,ride:`車程 20 分鐘`,title:`Puponfai & Zapponfai 咖哩炒螃蟹海鮮餐廳`,en:`Puponfai & Zapponfai`,verified:!1,query:`Puponfai Zapponfai Bangkok`,cover:`my-logo.png`,memo:`必吃**蟹肉炒蛋、炒飯（要蔥多）、炸豬頸肉、海鮮冬粉煲**`,detail:`Sai ton-hom yuer-yuer\n曼谷朱拉美食街的頂級海鮮炒飯，這間每次經過都在排隊，這間除了價位偏高一點外，沒什麼缺點。\n海鮮也都很新鮮好吃，記得點炒飯要跟他們說蔥加多一點，還有炸豬頸肉也一定要點，其他還有很多泰式生醃海鮮也很讚。\n請大家必須來吃蟹肉炒蛋，不誇張會升天⋯⋯奶油的香氣貫穿，炒蛋的熟度剛剛好，蟹肉摻入蛋末，滑嫩入口，是整趟旅程最難以忘懷的味道！他的海鮮冬粉煲也很厲害，鍋氣十足，真的以為是小當家開的😍`},{id:`d3-samatha`,part:`晚上`,category:`massage`,time:`20:00–22:00`,ride:`車程 15 分鐘`,title:`Samatha (สมถะ) Thai Massage`,en:`Samatha Thai Massage`,address:`476/25 Phraya Singhaseni Alley, Rong Mueang, Pathum Wan, Bangkok 10330`,verified:!0,query:`Samatha Thai Massage, Phraya Singhaseni Alley, Pathum Wan, Bangkok`,cover:`my-logo.png`,memo:`距離首選、價格超甜\n全店只有一間Private Room（包廂）一定要提前預訂。只收現金`,detail:`透過IG預約，回覆速度快，英文也很好，價錢相當實惠。\n一間柳暗花明又一村的美麗小店，綠蔭跟實木的交織讓心情放鬆了許多。店內有一股藥草膏的香氣，店員會輕聲細語跟你確認預約跟溝通需求。整體空間用簾子隔開，隔音普通，按摩區域很大，環境安靜、燈光偏暗，氛圍相當不錯。\n精油有五種味道可選：\nOrange（甜橙）：其清新、甜美且充滿柑橘調的香氣，能幫助提振情緒並活化感官，營造積極且富有活力的氛圍。它也有助於減少焦慮、抑鬱與壓力感，並對心靈產生鎮定作用，從而提升專注力與注意力。\nEucalyptus（尤加利）：其清新、帶有藥草感且令人振奮的香氣，有助於改善呼吸道功能並緩解頭痛。它還能幫助清空雜念，帶來專注與清晰感。\nLavender（薰衣草）：其清新、花香且具撫慰效果的香氣，能幫助促進高品質睡眠，並減輕焦慮與壓力感。它也能對身心發揮舒緩作用，促進放鬆與身心健康。\nJasmine（茉莉）：其溫暖、花香且甜美的香氣，有助於釋放壓力並帶來平靜與放鬆感，非常適合用於冥想與瑜伽練習。它還能提供平靜與寧謐感，對神經系統產生積極影響，協助舒緩壓力與緊張感。\nRose（玫瑰）或Lemongrass（檸檬草）：其清新、柑橘調且帶有草本感的香氣，能幫助刺激細胞並提升活力水平，促進充滿生機與煥然一新的感受，亦有助於清空雜念，帶來專注與清晰感。\n精油按摩120分鐘 ฿1000\n熱精油按摩120分鐘 ฿1200\n泰式按摩120分鐘 ฿900`},{id:`d3-bigc`,part:`晚上`,category:`plain`,time:`22:30–23:30`,ride:`車程 30 分鐘`,title:`BigC Foodplace Asiatique`,en:`Big C Foodplace Asiatique`,verified:!1,query:`Big C Foodplace Asiatique Bangkok`,memo:`去超市採買伴手禮，營業到24點\n不提供購物袋，**記得自備環保袋**`,cover:`my-logo.png`,detail:`相較於市中心熱門的分店，這間BIG C的人潮明顯少很多，但商品完整度卻一點都不打折，尤其購物滿額達2000泰銖也都能申請退稅。\n從蜂蜜、牛奶片，到大象或小熊造型唇膏等觀光客喜愛的伴手禮幾乎都能找到，甚至連椰奶巧克力、芒果乾等經典泰式零食也都相當齊全。\n特別的是，這裡也有現烤海鮮與現做泰式料理區，隨時可以直接在園區內用餐，不用再另外找餐廳。\n這裡整體空間規劃單純，以單層樓設計為主，動線清楚，不需要像大型分店一樣繞來繞去，加上人潮較少、結帳速度也更順暢，逛起來反而更輕鬆有效率！`},{id:`d3-back`,part:`晚上`,category:`hotel`,time:`24:00`,ride:`車程 30 分鐘`,title:`抵達酒店休息`,en:k.en,address:k.address,query:`Mandarin Oriental Bangkok`}]},{id:`d4`,date:`2026-10-11`,dow:`日`,md:`10/11`,items:[{id:`d4-bf`,part:`早上`,category:`food`,time:`07:00–11:00`,title:`飯店自助早餐`,en:k.en,address:k.address,query:`Mandarin Oriental Bangkok`,memo:`先整理好行李，11點要退房，11:20有預約送機`},{id:`d4-van`,part:`早上`,category:`plain`,time:`11:20`,title:`機場送機（8人座VAN）`,en:`Suvarnabhumi Airport (BKK)`,address:`999 Moo 1, Nong Prue, Bang Phli, Samut Prakan 10540`,verified:!0,query:`Suvarnabhumi Airport`,memo:`尾款 **฿450**（泰銖，現場付）`},{id:`d4-bkk`,part:`下午`,category:`plain`,time:`12:30`,ride:`車程約 50 分鐘`,title:`抵達曼谷素萬那普機場（BKK）`,en:`Suvarnabhumi Airport (BKK)`,address:`999 Moo 1, Nong Prue, Bang Phli, Samut Prakan 10540`,verified:!0,query:`Suvarnabhumi Airport`,memo:`要退稅先不要急著進去托運`,cover:`my-logo.png`,detail:`步驟1：抵達機場後先至VAT REFUND海關櫃檯\n步驟2：辦理登機與行李託運\n步驟3：完成護照查驗出境\n步驟4：前往 VAT REFUND OFFICE 領取退稅\n步驟5：依退稅金額選擇付款方式`},{id:`d4-fly`,part:`下午`,category:`plain`,time:`15:20`,title:`起飛｜BR076長榮航空`,noNav:!0,subtitle:`曼谷BKK → 桃園T2，20:10抵達，飛行約3小時50分`,memo:`託運行李限重 **23 公斤**`},{id:`d4-tpe`,part:`晚上`,category:`plain`,time:`20:10`,title:`抵達桃園機場（第2航廈）`,en:`Taiwan Taoyuan International Airport Terminal 2`,address:`33758桃園市大園區三石里航站南路9號`,verified:!0,query:`Taoyuan International Airport Terminal 2`,noNav:!0},{id:`d4-home`,part:`晚上`,category:`plain`,time:`22:00`,title:`Sweet Home 💕`,noNav:!0}]}];function We({days:e,active:t,onChange:n}){return(0,x.jsx)(`div`,{className:`sticky top-0 z-10 flex gap-2 overflow-x-auto py-2.5 -mx-0.5 px-0.5 no-scrollbar`,style:{background:`linear-gradient(#F7F4EB 82%, rgba(247,244,235,0))`},role:`tablist`,"aria-label":`選擇日期`,children:e.map((e,r)=>(0,x.jsxs)(`button`,{role:`tab`,"aria-selected":e.id===t,onClick:()=>n(e.id),className:`flex-1 min-w-[74px] flex flex-col items-center py-1.5 rounded-blobSm border-2 leading
